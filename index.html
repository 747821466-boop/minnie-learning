<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f48fb1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Minnie学习台">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23f48fb1'/%3E%3Ccircle cx='45' cy='45' r='6' fill='%23333'/%3E%3Ccircle cx='75' cy='45' r='6' fill='%23333'/%3E%3Cpath d='M40 62 Q60 78 80 62' stroke='%23333' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cellipse cx='35' cy='25' rx='8' ry='18' fill='%23fff' transform='rotate(-15 35 25)'/%3E%3Cellipse cx='85' cy='25' rx='8' ry='18' fill='%23fff' transform='rotate(15 85 25)'/%3E%3Cellipse cx='32' cy='22' rx='4' ry='10' fill='%23f8bbd0' transform='rotate(-15 32 22)'/%3E%3Cellipse cx='88' cy='22' rx='4' ry='10' fill='%23f8bbd0' transform='rotate(15 88 22)'/%3E%3C/svg%3E">
<title>Minnie每日学习工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fdf0f5;--card:#fff;--pri:#f48fb1;--pri-d:#ec407a;--pri-l:#fce4ec;--accent:#ffd54f;--text:#4a3b45;--text-l:#ad8a99;--green:#66bb6a;--pink:#f06292;--orange:#ff8a65;--purple:#ab47bc;--r:16px}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.6;overflow:hidden}
#app{display:flex;height:100vh;height:100dvh}
.nav{width:200px;background:#fff;border-right:1px solid #f0d4e0;display:flex;flex-direction:column;padding:8px 0;flex-shrink:0;overflow-y:auto}
.nav-logo{text-align:center;padding:10px 8px;font-size:17px;font-weight:700;color:var(--pri-d)}
.nav-logo span{display:block;font-size:11px;color:var(--text-l);font-weight:400;margin-top:2px}
.nav-item{display:flex;align-items:center;padding:11px 16px;cursor:pointer;transition:all .2s;border-left:4px solid transparent;font-size:15px;gap:8px}
.nav-item:hover{background:#fdf0f5}
.nav-item.active{background:var(--pri-l);border-left-color:var(--pri-d);color:var(--pri-d);font-weight:600}
.nav-item .icon{font-size:20px;width:24px;text-align:center}
.nav-stat{margin-top:auto;padding:10px 16px;border-top:1px solid #f0d4e0;font-size:12px;color:var(--text-l)}
.nav-stat b{color:var(--pri-d);font-size:18px}
.nav-stat .feed{color:var(--orange)}
.main{flex:1;overflow-y:auto;padding:16px 24px;-webkit-overflow-scrolling:touch}
.panel{display:none;animation:fade .3s}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.pt{font-size:22px;font-weight:700;color:var(--pri-d)}
.pt .sub{font-size:13px;color:var(--text-l);font-weight:400;margin-left:6px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h3{color:var(--pri-d);margin-bottom:8px;font-size:17px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border:none;border-radius:10px;background:var(--pri);color:#fff;font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{background:var(--pri-d);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-acc{background:var(--accent);color:#5d4037}
.btn-green{background:var(--green)}
.btn-pink{background:var(--pink)}
.btn-orange{background:var(--orange)}
.ci{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #f0d4e0}
.ci:last-child{border-bottom:none}
.cb{width:26px;height:26px;border:2px solid var(--pri);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s}
.cb:hover{background:var(--pri-l)}
.cb.done{background:var(--green);border-color:var(--green)}
.cb.done::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
.it{flex:1;font-size:16px}
.it.done{text-decoration:line-through;color:var(--text-l)}
.pb{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pc{background:#fff;border-radius:12px;padding:7px 14px;display:flex;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:13px}
.pc .n{font-size:19px;font-weight:700;color:var(--pri-d)}
.pc.feed .n{color:var(--orange)}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wc{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.wc .ch{font-size:30px;font-weight:700;color:var(--pri-d);margin-bottom:2px}
.wc .py{color:var(--text-l);font-size:13px;margin-bottom:3px}
.wc .mn{font-size:12px;color:#5d4037}
.wc .btn-sm{margin-top:6px}
.pt2{text-align:center;font-size:21px;font-weight:700;margin-bottom:4px}
.pa{text-align:center;color:var(--text-l);margin-bottom:12px;font-size:14px}
.pob{text-align:center;font-size:20px;line-height:2;letter-spacing:2px}
.pot{margin-top:12px;padding:10px 14px;background:#f5f9fc;border-radius:10px;font-size:14px;color:var(--text-l)}
.mq{font-size:20px;font-weight:600;margin-bottom:8px;text-align:center}
.ma{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.ma input{width:70px;padding:5px 8px;border:2px solid var(--pri);border-radius:8px;font-size:18px;text-align:center;font-family:inherit}
.ma input:focus{outline:none;border-color:var(--pri-d)}
.ma .btn{padding:5px 12px}
.mr{text-align:center;margin-top:6px;font-size:14px;min-height:20px}
.mr.ok{color:var(--green);font-weight:600}
.mr.no{color:var(--pink)}
.en-w{font-size:20px;font-weight:600;color:var(--pri-d)}
.en-m{color:var(--text-l);margin:3px 0}
.en-s{background:#f5f9fc;padding:8px 12px;border-radius:8px;font-size:15px;margin-top:5px;line-height:1.5}
.sci-q{font-size:18px;font-weight:600;margin-bottom:8px}
.sci-a{padding:10px;background:#f5f9fc;border-radius:8px;font-size:15px;line-height:1.7}
.pet-a{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;padding:14px}
.pet-c{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#fff3e0,#ffe0b2);display:flex;align-items:center;justify-content:center;font-size:55px;position:relative}
.pet-c.happy{background:linear-gradient(135deg,#c8e6c9,#a5d6a7)}
.pet-c.sad{background:linear-gradient(135deg,#ffcdd2,#ef9a9a)}
.pet-c .badge{position:absolute;bottom:-4px;right:-4px;width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.pbars{width:200px}
.pbar{margin:5px 0}
.pbar .lb{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px}
.pbar .bg{height:10px;background:#e0e7ee;border-radius:5px;overflow:hidden}
.pbar .fl{height:100%;border-radius:5px;transition:width .5s}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:560px}
.cc{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all .15s;border:2px solid transparent;position:relative}
.cc.hd{font-weight:600;color:var(--text-l);cursor:default;background:transparent}
.cc.dy:hover{background:var(--pri-l)}
.cc.ck{background:var(--green);color:#fff;font-weight:600}
.cc.td{border-color:var(--pink)}
.cc .mk{position:absolute;bottom:1px;right:1px;font-size:7px;display:flex;gap:1px}
.rw{text-align:right;margin-bottom:8px}
.ri{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-left:5px;animation:pl 1s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:12px;font-size:15px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:768px){
.nav{width:64px}.nav-item{padding:8px 0;flex-direction:column;font-size:10px;gap:2px}
.nav-item .icon{font-size:20px}.nav-logo{font-size:12px}.nav-logo span{display:none}
.nav-stat{font-size:10px;padding:6px 4px}.nav-stat b{font-size:14px}
.main{padding:10px 12px}.pt{font-size:18px}
.wg{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.pob{font-size:18px}.mq{font-size:18px}
}
.tip-bar{background:linear-gradient(135deg,#fff3e0,#ffe0b2);border-left:4px solid #ff8a65;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:#5d4037;line-height:1.6}
.tip-bar b{color:#e65100}
.tip-bar .emoji{margin-right:4px}
.guide-section{background:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.guide-section h3{color:var(--pri-d);font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.guide-section h3 .icon{font-size:22px}
.guide-list{list-style:none;padding:0;margin:0}
.guide-list li{padding:6px 0 6px 22px;position:relative;font-size:15px;line-height:1.7;color:var(--text)}
.guide-list li::before{content:'';position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.guide-list li b{color:var(--pri-d)}
.timer-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--pri);z-index:998;transition:width 1s linear}
.timer-bar.rest{background:var(--green)}
.break-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:997;display:flex;align-items:center;justify-content:center}
.break-box{background:#fff;border-radius:20px;padding:30px;text-align:center;max-width:320px}
.break-box .emoji{font-size:50px;margin-bottom:10px}
.break-box h3{color:var(--green);font-size:20px;margin-bottom:8px}
.break-box p{color:var(--text-l);font-size:14px;margin-bottom:16px}
/* ============ 农场模块样式 ============ */
.farm-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.farm-tab{padding:8px 14px;border-radius:10px;background:#fff;border:2px solid #e0d4e0;font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit}
.farm-tab.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.farm-tab:active{transform:scale(.95)}
.farm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.plot{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;background:linear-gradient(135deg,#d4a373,#c9a06b);border:3px solid #b8860b}
.plot:active{transform:scale(.95)}
.plot:hover{box-shadow:0 4px 12px rgba(0,0,0,.15)}
.plot .soil{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(180deg,#8b7355,#6b4f2f)}
.plot .crop-emoji{font-size:36px;z-index:1;animation:cropGrow .5s ease}
.plot .stage-tag{font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px;margin-top:2px;z-index:1}
.plot .health-bar{position:absolute;top:4px;left:4px;right:4px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;z-index:2}
.plot .health-bar .fl{height:100%;border-radius:2px;background:#66bb6a;transition:width .3s}
.plot.wilted{filter:grayscale(1);opacity:.5}
.plot.wilted .crop-emoji{animation:wilt .5s ease forwards}
.plot.locked{background:linear-gradient(135deg,#e0e0e0,#bdbdbd);border-color:#9e9e9e;cursor:not-allowed}
.plot .bear-emoji{position:absolute;font-size:28px;z-index:3;animation:bearAttack 1.5s ease infinite}
@keyframes cropGrow{from{transform:scale(0) translateY(10px)}to{transform:scale(1) translateY(0)}}
@keyframes wilt{0%{transform:scale(1)}100%{transform:scale(.8) rotate(-15deg);opacity:.3}}
@keyframes bearAttack{0%{transform:translateX(120%) rotate(0deg)}30%{transform:translateX(0) rotate(5deg)}60%{transform:translateX(0) rotate(-5deg)}100%{transform:translateX(-120%) rotate(0deg)}}
.farm-stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.farm-stat{background:#fff;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:6px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.farm-stat .n{font-size:20px;font-weight:700}
.farm-stat.sun .n{color:#ffa726}
.farm-stat.coin .n{color:#ffc107}
.farm-stat.seed .n{color:var(--green)}
.farm-shop-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.farm-shop-item .ic{font-size:32px;flex-shrink:0}
.farm-shop-item .info{flex:1}
.farm-shop-item .info h4{font-size:16px;color:var(--text);margin-bottom:2px}
.farm-shop-item .info p{font-size:13px;color:var(--text-l)}
.farm-shop-item .buy-btn{padding:8px 16px;border:none;border-radius:10px;background:var(--green);color:#fff;font-size:14px;cursor:pointer;font-family:inherit;flex-shrink:0}
.farm-shop-item .buy-btn:active{transform:scale(.95)}
.farm-shop-item .buy-btn:disabled{background:#ccc;cursor:not-allowed}
.farm-alert{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:996;display:flex;align-items:center;justify-content:center;padding:20px}
.farm-alert-box{background:#fff;border-radius:20px;padding:24px;max-width:360px;text-align:center}
.farm-alert-box .big-emoji{font-size:48px;margin-bottom:10px}
.farm-alert-box h3{color:var(--pri-d);font-size:18px;margin-bottom:10px}
.farm-alert-box p{color:var(--text-l);font-size:14px;line-height:1.6;margin-bottom:16px}
.farm-alert-box .btns{display:flex;gap:8px;justify-content:center}
.farm-empty{text-align:center;color:var(--text-l);padding:30px;font-size:15px}
@media(max-width:768px){
.farm-grid{grid-template-columns:repeat(2,1fr)}
.plot .crop-emoji{font-size:28px}
.farm-shop-item{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app">
<div class="nav">
<div class="nav-logo">🐰 Minnie<span>每日学习工作台</span></div>
<div class="nav-item active" data-p="reading" onclick="sw('reading')"><span class="icon">📖</span>阅读专区</div>
<div class="nav-item" data-p="words" onclick="sw('words')"><span class="icon">🔤</span>生字专区</div>
<div class="nav-item" data-p="poems" onclick="sw('poems')"><span class="icon">📜</span>三年级古诗</div>
<div class="nav-item" data-p="math" onclick="sw('math')"><span class="icon">🔢</span>数学专区</div>
<div class="nav-item" data-p="science" onclick="sw('science')"><span class="icon">🔬</span>科普专区</div>
<div class="nav-item" data-p="english" onclick="sw('english')"><span class="icon">🅰️</span>英语阅读</div>
<div class="nav-item" data-p="chores" onclick="sw('chores')"><span class="icon">🧹</span>家务劳动</div>
<div class="nav-item" data-p="pet" onclick="sw('pet')"><span class="icon">🐰</span>小宠物中心</div>
<div class="nav-item" data-p="farm" onclick="sw('farm')"><span class="icon">🌻</span>我的农场</div>
<div class="nav-item" data-p="calendar" onclick="sw('calendar')"><span class="icon">📅</span>日历打卡</div>
<div class="nav-item" data-p="guide" onclick="sw('guide')"><span class="icon">📋</span>学习指南</div>
<div class="nav-stat">⭐积分<b id="nP">0</b><br>🌾饲料<b class="feed" id="nF">0</b><br>🌞阳光<b style="color:#ffa726" id="nSun">0</b> 🪙金币<b style="color:#ffc107" id="nCoin">0</b><br><span id="timerDisp" style="font-size:11px;color:var(--purple)"></span></div>
</div>
<div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>
<div class="timer-bar" id="timerBar" style="width:0;display:none"></div>
<div class="break-overlay" id="breakOverlay" style="display:none">
<div class="break-box">
<div class="emoji">🌿</div>
<h3>休息时间到啦！</h3>
<p>你已经学习了25分钟，<br>远眺放松5分钟，保护眼睛哦～</p>
<button class="btn btn-green" onclick="endBreak()">好的，休息完毕</button>
</div>
</div>

<script>
// ============ 数据存储 ============
var D={
  load:function(){try{return JSON.parse(localStorage.getItem('minnieData')||'{}')}catch(e){return{}}},
  save:function(d){localStorage.setItem('minnieData',JSON.stringify(d))},
  get:function(k,f){var d=this.load();return d[k]!==undefined?d[k]:f},
  set:function(k,v){var d=this.load();d[k]=v;this.save(d)}
};
var today=new Date().toISOString().slice(0,10);

// ============ 积分/饲料 ============
function addPoints(n,feed){
  var p=D.get('points',0)+n;
  D.set('points',p);
  if(feed){var f=D.get('feed',0)+feed;D.set('feed',f);}
  updateNav();
  toast('+'+n+'积分'+(feed?' +'+feed+'饲料🌾':'')+' ⭐');
}
function updateNav(){
  document.getElementById('nP').textContent=D.get('points',0);
  document.getElementById('nF').textContent=D.get('feed',0);
  var elSun=document.getElementById('nSun');if(elSun)elSun.textContent=D.get('farm_sun',0);
  var elCoin=document.getElementById('nCoin');if(elCoin)elCoin.textContent=D.get('farm_coins',0);
}

// ============ 每日种子 ============
function daySeed(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function pick(arr,seed,n){
  var r=[],s=seed||daySeed(),idx=s%arr.length;
  for(var i=0;i<Math.min(n||1,arr.length);i++){r.push(arr[(idx+i)%arr.length]);}
  return r;
}

// ============ 语音朗读 ============
var speaking=false;
function speak(text,rate){
  if(speaking)window.speechSynthesis.cancel();
  speaking=true;
  var u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=rate||0.9;u.pitch=1.1;
  u.onend=function(){speaking=false;};
  u.onerror=function(){speaking=false;};
  window.speechSynthesis.speak(u);
}
function speakEl(id){var t=document.getElementById(id);if(t)speak(t.textContent);}
function speakText(t){speak(t);}

// ============ 面板切换 ============
function sw(name){
  if(typeof renderPanel==='function'){
    renderPanel(name);
  }else{
    document.querySelectorAll('.nav-item').forEach(function(e){e.classList.remove('active')});
    var nav=document.querySelector('[data-p="'+name+'"]');if(nav)nav.classList.add('active');
    document.querySelectorAll('.panel').forEach(function(e){e.classList.remove('active')});
    var p=document.getElementById('p-'+name);if(p)p.classList.add('active');
  }
}

// ============ 打卡 ============
function isChecked(name){var c=D.get('check_'+today,{});return c[name]||false;}
function toggleCheck(name){
  var c=D.get('check_'+today,{});
  c[name]=!c[name];D.set('check_'+today,c);
  var el=document.getElementById('chk-'+name);
  var tx=el?el.nextElementSibling:null;
  if(c[name]){
    if(el)el.classList.add('done');
    if(tx)tx.classList.add('done');
    addPoints(10,2);
    if(name!=='pet'&&name!=='calendar')updateCalMarks();
    // ============ 农场联动：作业打卡奖励 ============
    if(name==='reading'||name==='words'){
      farmOnCheck('chinese'); // 语文打卡奖励
    }else if(name==='math'){
      farmOnCheck('math'); // 数学打卡奖励
    }else if(name==='english'){
      farmOnCheck('english'); // 英语打卡奖励
      // 补偿机制：如果之前有遗漏（farm_bears存在），补做后给杀虫剂
      if(D.get('farm_bears',[]).length>0)farmOnMakeup('english');
    }

function genMath(){
  var s=daySeed();
  var qs=[];
  for(var i=0;i<6;i++){
    var a=((s+i*7)%80)+20;
    var b=((s+i*13)%60)+10;
    var op=(s+i)%3;
    var q,ans;
    if(op===0){q=a+' + '+b+' = ?';ans=a+b;}
    else if(op===1){if(a<b){var t=a;a=b;b=t;}q=a+' − '+b+' = ?';ans=a-b;}
    else{var c=((s+i*3)%8)+2;var r=a*c;q=c+' × '+a+' = ?';ans=r;}
    qs.push({q:q,a:ans});
  }
  return qs;
}

// 学科种子配置：对应作物emoji、名称、收获金币、生长阶段emoji
var FARM_CROPS={
  chinese:{name:'语文种子',crop:'🌷',cropName:'郁金香',coins:15,stages:['🌱','🌿','🌸','🌷']},
  math:{name:'数学种子',crop:'🥕',cropName:'胡萝卜',coins:20,stages:['🌱','🌿','🌿','🥕']},
  english:{name:'英语种子',crop:'🌻',cropName:'向日葵',coins:18,stages:['🌱','🌿','🌼','🌻']}
};
var FARM_PLOT_COUNT=6; // 地块数量（可调整）
// 惩罚参数（可调整）
var FARM_PENALTY={miss1:{bears:1,healthDmg:1,stealPct:0.5,wiltMature:0},miss2:{bears:2,healthDmg:2,stealPct:0.5,wiltMature:1},miss3:{bears:3,healthDmg:3,stealPct:0.5,wiltMature:99}};

// 初始化农场数据
function farmInit(){
  if(!D.get('farm_plots',null)){
    var plots=[];
    for(var i=0;i<FARM_PLOT_COUNT;i++){plots.push({seed:null,stage:0,health:4,isWilted:false,hasBear:false});}
    D.set('farm_plots',plots);
  }
  if(!D.get('farm_seeds',null))D.set('farm_seeds',{chinese:0,math:0,english:0});
  if(!D.get('farm_items',null))D.set('farm_items',{pesticide:0,shield:0});
  if(!D.get('farm_sun',null))D.set('farm_sun',0);
  if(!D.get('farm_coins',null))D.set('farm_coins',0);
  if(!D.get('farm_shield_active',null))D.set('farm_shield_active',false);
  if(!D.get('farm_streak',null))D.set('farm_streak',0);
  if(!D.get('farm_unlocked_skins',null))D.set('farm_unlocked_skins',[]);
}

// 获取昨日日期字符串
function getYesterday(){
  var d=new Date();d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

// 【核心联动】农场夜间结算——惩罚机制
function farmSettle(){
  farmInit();
  var lastSettle=D.get('farm_last_settle','');
  var yesterday=getYesterday();
  // 如果已经结算过昨天，跳过
  if(lastSettle===today||lastSettle===yesterday)return null;

  // 检查昨天的作业打卡情况
  var yCheck=D.get('check_'+yesterday,{});
  // 语文=reading+words, 数学=math, 英语=english
  var chineseDone=yCheck.reading||yCheck.words;
  var mathDone=yCheck.math;
  var englishDone=yCheck.english;
  var missed=0;
  if(!chineseDone)missed++;
  if(!mathDone)missed++;
  if(!englishDone)missed++;

  if(missed===0){
    // 全部完成，无惩罚，连续打卡+1
    var streak=D.get('farm_streak',0)+1;
    D.set('farm_streak',streak);
    D.set('farm_last_settle',yesterday);
    return {missed:0,bears:0,msg:'昨天三科作业全部完成！农场平安无事，连续打卡'+streak+'天 🎉'};
  }

  // 重置连续打卡
  D.set('farm_streak',0);
  var penalty=FARM_PENALTY['miss'+missed];
  var plots=D.get('farm_plots',[]);
  var bears=[];

  // 护盾抵消一次攻击
  if(D.get('farm_shield_active',false)){
    D.set('farm_shield_active',false);
    D.set('farm_last_settle',yesterday);
    return {missed:missed,bears:0,msg:'昨晚'+missed+'只小狗熊来犯，但护盾抵挡了攻击！🛡️ 农场安全！'};
  }

  // 执行小狗熊攻击
  for(var i=0;i<penalty.bears;i++){
    // 随机选一块有作物的地块攻击
    var validPlots=[];
    for(var j=0;j<plots.length;j++){
      if(plots[j].seed&&!plots[j].isWilted)validPlots.push(j);
    }
    if(validPlots.length>0){
      var pIdx=validPlots[Math.floor(Math.random()*validPlots.length)];
      plots[pIdx].health-=penalty.healthDmg;
      if(plots[pIdx].health<0)plots[pIdx].health=0;
      // 成熟作物枯萎逻辑
      if(penalty.wiltMature>0&&plots[pIdx].stage>=3){
        plots[pIdx].isWilted=true;
        if(penalty.wiltMature<99)penalty.wiltMature--; // 只枯萎指定数量
      }else if(penalty.wiltMature>=99){
        plots[pIdx].isWilted=true;
      }
      plots[pIdx].hasBear=true;
      bears.push({plotIdx:pIdx});
    }
  }
  D.set('farm_plots',plots);

  // 偷取金币
  var coins=D.get('farm_coins',0);
  var stolen=Math.floor(coins*penalty.stealPct);
  D.set('farm_coins',coins-stolen);

  D.set('farm_last_settle',yesterday);
  D.set('farm_bears',bears);

  var msgs=['昨晚'+missed+'只小狗熊入侵了农场！','作物健康度-'+penalty.healthDmg,'被偷走'+stolen+'金币🪙'];
  if(penalty.wiltMature>0)msgs.push('有作物被啃食枯萎了💔');
  return {missed:missed,bears:bears,msg:msgs.join('，')};
}

// 【核心联动】作业打卡奖励——在toggleCheck中调用
function farmOnCheck(subject){
  farmInit();
  // subject: chinese/math/english
  var seedMap={chinese:'chinese',math:'math',english:'english'};
  var seedKey=seedMap[subject];
  if(!seedKey)return;

  // 单科奖励：+1阳光, +1对应种子
  D.set('farm_sun',D.get('farm_sun',0)+1);
  var seeds=D.get('farm_seeds',{chinese:0,math:0,english:0});
  seeds[seedKey]=(seeds[seedKey]||0)+1;
  D.set('farm_seeds',seeds);

  // 检查三科是否全部完成
  var ck=D.get('check_'+today,{});
  var cDone=ck.reading||ck.words;
  var mDone=ck.math;
  var eDone=ck.english;
  if(cDone&&mDone&&eDone){
    // 三科全完成额外奖励：+2阳光(共3), +3随机种子
    D.set('farm_sun',D.get('farm_sun',0)+2);
    var keys=['chinese','math','english'];
    for(var i=0;i<3;i++){
      var rk=keys[Math.floor(Math.random()*3)];
      seeds[rk]=(seeds[rk]||0)+1;
    }
    D.set('farm_seeds',seeds);
    // 宠物额外成长
    var h=D.get('pet_happy',50)+5;if(h>100)h=100;D.set('pet_happy',h);
    toast('🌻 三科全完成！+3阳光，+3随机种子，宠物+5开心！');
  }else{
    toast('🌻 +1阳光，+1'+FARM_CROPS[seedKey].name+'！');
  }
  updateNav();
}

// 【补偿机制】补做遗漏作业后获得杀虫剂
function farmOnMakeup(subject){
  farmInit();
  var items=D.get('farm_items',{pesticide:0,shield:0});
  items.pesticide+=1;
  D.set('farm_items',items);
  toast('🔧 补做完成！获得1个杀虫剂，可以去农场清除小狗熊！');
}

// 作物生长推进
function farmGrowAll(){
  farmInit();
  var plots=D.get('farm_plots',[]);
  for(var i=0;i<plots.length;i++){
    if(plots[i].seed&&!plots[i].isWilted&&plots[i].stage<3){
      plots[i].stage++;
    }
  }
  D.set('farm_plots',plots);
}

// 农场每日初始化
function farmDailyInit(){
  farmInit();
  var lastDay=D.get('farm_last_day','');
  if(lastDay!==today){
    // 新一天：先结算昨晚的惩罚
    var result=farmSettle();
    // 推进作物生长
    farmGrowAll();
    D.set('farm_last_day',today);
    // 存储结算结果供进入农场时显示
    if(result)D.set('farm_settle_result',result);
  }
}

// 进入农场时检查弹窗
function farmCheckAlert(){
  farmInit();
  // 先检查结算结果
  var result=D.get('farm_settle_result',null);
  if(result){
    D.set('farm_settle_result',null); // 只显示一次
    farmShowAlert(result.missed===0?'🌙':'🐻',result.missed===0?'农场平安！':'小狗熊来袭！',result.msg);
    return;
  }
  // 检查今日未完成科目
  var ck=D.get('check_'+today,{});
  var cDone=ck.reading||ck.words;
  var mDone=ck.math;
  var eDone=ck.english;
  var missed=[];
  if(!cDone)missed.push('语文');
  if(!mDone)missed.push('数学');
  if(!eDone)missed.push('英语');
  if(missed.length>0){
    var hour=new Date().getHours();
    var prefix=hour>=18?'今晚':'今天';
    farmShowAlert('⚠️','还有作业未完成！','还有'+missed.length+'科作业未完成（'+missed.join('、')+'），'+prefix+'小狗熊会来破坏你的菜园！快去打卡完成任务');
  }
}

// 地块点击：播种或收获
function farmPlotClick(idx){
  farmInit();
  var plots=D.get('farm_plots',[]);
  var p=plots[idx];
  if(!p)return;

  if(p.isWilted){
    toast('💔 作物已枯萎，需要杀虫剂修复');
    return;
  }

  if(!p.seed){
    // 空地：播种
    var seeds=D.get('farm_seeds',{chinese:0,math:0,english:0});
    // 找有库存的种子
    var available=[];
    if(seeds.chinese>0)available.push('chinese');
    if(seeds.math>0)available.push('math');
    if(seeds.english>0)available.push('english');
    if(available.length===0){
      toast('没有种子！完成作业打卡获取种子');
      return;
    }
    // 如果只有一种，直接播种；多种则选第一种（简化操作）
    var seedKey=available[0];
    if(available.length>1){
      // 弹出选择
      var opts='';
      available.forEach(function(k){opts+='<button class="btn btn-sm" style="margin:4px" onclick="farmPlant('+idx+',\''+k+'\')">'+FARM_CROPS[k].crop+' '+FARM_CROPS[k].name+' x'+seeds[k]+'</button>';});
      farmShowAlert('🌱','选择种子播种',opts);
      return;
    }
    farmPlant(idx,seedKey);
    return;
  }

  // 有作物
  if(p.stage>=3){
    // 成熟：收获
    var crop=FARM_CROPS[p.seed];
    var coins=crop.coins;
    D.set('farm_coins',D.get('farm_coins',0)+coins);
    p.seed=null;p.stage=0;p.health=4;p.isWilted=false;p.hasBear=false;
    D.set('farm_plots',plots);
    toast('🌾 收获'+crop.cropName+'！+'+coins+'金币🪙');
    updateNav();
    renderPanel('farm');
    return;
  }

  // 未成熟
  if(p.hasBear){
    toast('🐻 小狗熊在啃食！用杀虫剂驱赶');
    return;
  }
  toast('🌱 正在生长中...阶段'+p.stage+'/3');
}

// 使用杀虫剂
function farmUsePesticide(){
  farmInit();
  var items=D.get('farm_items',{pesticide:0,shield:0});
  if(items.pesticide<=0){toast('没有杀虫剂！补做遗漏作业可获得');return;}
  var plots=D.get('farm_plots',[]);
  var cleared=false;
  for(var i=0;i<plots.length;i++){
    if(plots[i].hasBear){
      plots[i].hasBear=false;
      plots[i].health=Math.min(4,plots[i].health+2);
      cleared=true;
    }
    if(plots[i].isWilted){
      plots[i].isWilted=false;
      plots[i].health=2;
      cleared=true;
    }
  }
  if(!cleared){toast('农场没有小狗熊，无需使用');return;}
  items.pesticide--;
  D.set('farm_items',items);
  D.set('farm_plots',plots);
  toast('🔫 杀虫剂使用成功！小狗熊被驱赶，作物恢复健康');
  renderPanel('farm');
}

function formatTime(sec){
  var m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ============ 学习计时器（25分钟学习+5分钟休息） ============
var timerRunning=false,timerSec=0,timerMode='study',timerInterval=null;
var STUDY_TIME=25*60,BREAK_TIME=5*60;
function startTimer(){
  if(timerRunning)return;
  timerRunning=true;
  var bar=document.getElementById('timerBar');
  if(bar)bar.style.display='block';
  timerInterval=setInterval(function(){
    timerSec++;
    updateTimerDisplay();
    if(timerMode==='study'&&timerSec>=STUDY_TIME){
      // 学习时间到，进入休息
      timerMode='break';
      timerSec=0;
      var ov=document.getElementById('breakOverlay');
      if(ov)ov.style.display='flex';
      if(bar){bar.className='timer-bar rest';bar.style.width='0%';}
      try{var u=new SpeechSynthesisUtterance('学习时间到啦！休息5分钟，远眺放松眼睛哦');u.lang='zh-CN';u.rate=0.9;window.speechSynthesis.speak(u);}catch(e){}
    }else if(timerMode==='break'&&timerSec>=BREAK_TIME){
      // 休息结束
      endBreak();
    }
  },1000);
  updateTimerDisplay();
  toast('学习计时开始！25分钟后提醒休息 ⏱️');
}
function pauseTimer(){
  timerRunning=false;
  clearInterval(timerInterval);
  updateTimerDisplay();
  toast('计时已暂停 ⏸️');
}
function resetTimer(){
  timerRunning=false;
  clearInterval(timerInterval);
  timerSec=0;timerMode='study';
  var bar=document.getElementById('timerBar');
  if(bar){bar.style.display='none';bar.className='timer-bar';bar.style.width='0%';}
  updateTimerDisplay();
  toast('计时已重置 🔄');
}
function endBreak(){
  timerMode='study';timerSec=0;
  var ov=document.getElementById('breakOverlay');
  if(ov)ov.style.display='none';
  var bar=document.getElementById('timerBar');
  if(bar){bar.className='timer-bar';bar.style.width='0%';}
  toast('休息完毕，继续加油！💪');
  try{var u=new SpeechSynthesisUtterance('休息完毕，继续加油');u.lang='zh-CN';u.rate=0.9;window.speechSynthesis.speak(u);}catch(e){}
}
function updateTimerDisplay(){
  var disp=document.getElementById('timerDisp');
  var bar=document.getElementById('timerBar');
  if(disp){
    var prefix=timerMode==='study'?'📖':'🌿';
    disp.textContent=timerRunning?(prefix+' '+formatTime(timerSec)):'';
  }
  if(bar&&timerRunning){
    var total=timerMode==='study'?STUDY_TIME:BREAK_TIME;
    var pct=Math.min(100,(timerSec/total)*100);
    bar.style.width=pct+'%';
  }
}

function renderCalendar(){
  var now=new Date();

  h+='<div class="card"><div class="cg">';
  heads.forEach(function(d){h+='<div class="cc hd">'+d+'</div>';});
  for(var i=0;i<first;i++){h+='<div class="cc empty"></div>';}
  for(var d=1;d<=days;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');

  var key='refresh_'+today+'_'+getCurrentPanelName();
  var rs=D.get(key,0);
  if(rs)seed=rs;
  return _origPick(arr,seed,n);
};
function getCurrentPanelName(){
  var a=document.querySelector('.nav-item.active');
  return a?a.getAttribute('data-p'):'reading';
}
// 语音朗读英文
function speakText(text,rate){
  if(speaking)window.speechSynthesis.cancel();
  speaking=true;
  var u=new SpeechSynthesisUtterance(text);
  // 英文用en-US，中文用zh-CN
  u.lang=/^[a-zA-Z]/.test(text)?'en-US':'zh-CN';
  u.rate=rate||0.9;u.pitch=1.1;
  u.onend=function(){speaking=false;};
  u.onerror=function(){speaking=false;};
  window.speechSynthesis.speak(u);
}
init();
</script>
